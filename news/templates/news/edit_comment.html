{% extends "base.html" %}

{% block title %}Редактирование комментария{% endblock %}

{% block body_class %}page page-news page-comment-edit{% endblock %}

{% block content %}
    <h1>✏️ Редактирование комментария</h1>

    <a class="back-link" href="{{ url_for('news.detail', news_id=comment.news_id) }}">← Вернуться к новости</a>

    <form method="POST" class="comment-form">
        <label>
            Текст комментария:
            <textarea class="rich-editor"  name="content" maxlength="{{ comment_max_length }}" required>{{ comment.content |emoji_img}}</textarea>
        </label>

        <button type="submit" class="btn">Сохранить</button>
    </form>
{% endblock %}
